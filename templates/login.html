<!DOCTYPE html>
<html>
<head>
    <title>Login - CodeGenie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.88)),
                url("https://png.pngtree.com/thumb_back/fh260/background/20240728/pngtree-encryption-symbols-and-digital-locks-secure-data-blue-cyber-shield-against-image_16018733.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .login-card {
            width: 400px;
            padding: 45px;
            border-radius: 18px;
            backdrop-filter: blur(20px);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,255,204,0.25);
            box-shadow: 0 0 40px rgba(0,255,204,0.15);
        }

        .brand-title {
            font-weight: 700;
            color: #00ffcc;
            letter-spacing: 1px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: #bbbbbb;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.15);
            border-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            color: white;
        }

        .btn-login {
            background: #00ffcc;
            border: none;
            color: black;
            font-weight: 600;
            padding: 10px;
            border-radius: 6px;
            transition: 0.3s ease;
            box-shadow: 0 0 12px #00ffcc;
        }

        .btn-login:hover {
            background: #00ccaa;
            box-shadow: 0 0 25px #00ffcc;
            transform: translateY(-2px);
        }

        a {
            color: #00ffcc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .home-link {
            position: absolute;
            top: 20px;
            left: 25px;
            color: #00ffcc;
            font-weight: 500;
            text-decoration: none;
        }

        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<a href="/" class="home-link">← Back to Home</a>

<div class="login-card text-center">

    <h3 class="brand-title">CodeGenie</h3>
    <div class="brand-subtitle">AI Explainer & Code Generator</div>

    <form method="POST">

        <div class="mb-3 text-start">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="d-grid mt-3">
            <button type="submit" class="btn btn-login">
                Login
            </button>
        </div>

        <div class="mt-3">
            <small>
                Don't have an account?
                <a href="/register">Register</a>
            </small>
        </div>

    </form>

</div>

</body>
</html>
