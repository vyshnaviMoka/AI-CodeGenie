<!DOCTYPE html>

<html>

<head>

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* Background */

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Segoe UI;
color:white;

background:
linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
url("https://png.pngtree.com/background/20210710/original/pngtree-blue-technology-background-banner-picture-image_1034452.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* Back button */

.back{
position:absolute;
top:20px;
left:20px;
color:#00f5d4;
text-decoration:none;
font-size:14px;
}

/* Card */

.card-box{
width:400px;
padding:40px;
border-radius:20px;
background:#111827;
border:1px solid rgba(0,255,200,0.25);
box-shadow:0 0 25px rgba(0,255,200,0.2);
}

/* Title */

.title{
text-align:center;
color:#00f5d4;
font-size:30px;
font-weight:600;
}

.subtitle{
text-align:center;
color:#9ca3af;
margin-bottom:25px;
}

/* Inputs */

.form-control{
background:#1f2937;
border:none;
color:white;
}

.form-control:focus{
background:#1f2937;
color:white;
box-shadow:0 0 10px #00f5d4;
}

/* Glow Login Button (same as user page) */

.btn-login{
background:#14e0b6;
border:none;
padding:12px;
font-size:16px;
color:black;
font-weight:500;
border-radius:8px;
transition:0.3s;
}

.btn-login:hover{
background:#19f5c8;
box-shadow:0 0 20px #14e0b6;
transform:scale(1.03);
}

</style>

</head>

<body>

<a href="/" class="back">← Back to Home</a>

<div class="card-box">

<div class="title">CodeGenie</div>
<div class="subtitle">AI Explainer & Code Generator</div>

<h4 class="text-center mb-4">Admin Login</h4>

{% if error %}

<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST" action="{{ url_for('admin_login') }}">

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" name="password" class="form-control" required>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-login">Login</button>
</div>

</form>

</div>

</body>

</html>
