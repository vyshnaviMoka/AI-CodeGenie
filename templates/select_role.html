<!DOCTYPE html>

<html>

<head>

<title>Select Login Type</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

/* Background */

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Segoe UI;
color:white;

background:
linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
url("https://img.freepik.com/free-vector/abstract-blue-technology-background_23-2149352058.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* Back button */

.back{
position:absolute;
top:20px;
left:20px;
color:#00f5d4;
text-decoration:none;
font-size:14px;
}

/* Card */

.card-box{
text-align:center;
background:#111827;
padding:45px;
width:500px;
border-radius:20px;
border:1px solid rgba(0,255,200,0.25);
box-shadow:0 0 25px rgba(0,255,200,0.2);
}

/* Title */

.title{
color:#00f5d4;
font-weight:600;
font-size:32px;
}

/* Subtitle */

.subtitle{
color:#9ca3af;
margin-bottom:25px;
}

/* Roles container */

.roles{
display:flex;
justify-content:center;
gap:40px;
margin-top:20px;
}

/* Role box */

.role{
text-align:center;
}

/* Icons */

.icon{
font-size:40px;
margin-bottom:10px;
}

/* Buttons */

.btn-role{
width:170px;
padding:12px;
font-size:15px;
border-radius:8px;
}

/* User button */

.btn-user{
background:#16a34a;
border:none;
color:white;
}

.btn-user:hover{
background:#22c55e;
box-shadow:0 0 12px #22c55e;
}

/* Admin button */

.btn-admin{
background:#dc2626;
border:none;
color:white;
}

.btn-admin:hover{
background:#ef4444;
box-shadow:0 0 12px #ef4444;
}

</style>

</head>

<body>

<a href="/" class="back">← Back to Home</a>

<div class="card-box">

<div class="title">CodeGenie</div>
<div class="subtitle">AI Explainer & Code Generator</div>

<h4>Select Login Type</h4>

<div class="roles">

<div class="role">

<i class="bi bi-person-circle icon" style="color:#22c55e;"></i>

<br>

<a href="/login">
<button class="btn btn-role btn-user">User Login</button>
</a>

</div>

<div class="role">

<i class="bi bi-person-lock icon" style="color:#ef4444;"></i>

<br>

<a href="/admin-login">
<button class="btn btn-role btn-admin">Admin Login</button>
</a>

</div>

</div>

</div>

</body>

</html>
