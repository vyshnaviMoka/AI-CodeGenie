<!DOCTYPE html>
<html>
<head>
    <title>CodeGenie - AI Explainer and Code Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;

            background:
                linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
                url("https://png.pngtree.com/background/20250806/original/pngtree-ai-programming-and-coding-concept-with-holographic-interface-picture-image_16902739.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        .hero-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hero-box {
            max-width: 850px;
        }

        .project-title {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .project-subtitle {
            font-size: 22px;
            margin-top: 10px;
            opacity: 0.85;
        }

        .description-text {
            font-size: 18px;
            margin-top: 20px;
            opacity: 0.8;
        }

        .typing-text {
            font-size: 26px;
            margin-top: 30px;
            font-weight: 500;
            color: #00ffcc;
            height: 40px;
        }

        /* THEME MATCHING BUTTON */
        .cta-button a {
            margin-top: 35px;
            display: inline-block;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: 600;
            color: black;
            background: #00ffcc;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s ease;
            box-shadow: 0 0 15px #00ffcc;
        }

        .cta-button a:hover {
            background: #00ccaa;
            box-shadow: 0 0 25px #00ffcc;
            transform: translateY(-3px);
        }

        footer {
            text-align: center;
            padding: 12px;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
        }
    </style>
</head>

<body>

<!-- Hero Section -->
<div class="hero-section">
    <div class="hero-box">

        <div class="project-title">CodeGenie</div>
        <div class="project-subtitle">AI Explainer & Code Generator</div>

        <div class="description-text">
            Generate clean, optimized and ready-to-use code in seconds using AI-powered technology.
        </div>

        <div class="typing-text">
            <span id="typed"></span>
        </div>

        <!-- Get Started Button -->
        <div class="cta-button">
            <a href="/select-role" class="btn btn-primary">
Get Started
</a>
        </div>

    </div>
</div>

<!-- Footer -->
<footer>
    CodeGenie © 2026 | AI Explainer and Code Generator
</footer>

<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

<script>
    var typed = new Typed("#typed", {
        strings: [
            "Generate Code Instantly 🚀",
            "Explain Programming Concepts Clearly 💡",
            "Boost Your Development Speed ⚡",
            "Your AI Coding Assistant 🤖"
        ],
        typeSpeed: 50,
        backSpeed: 30,
        backDelay: 1500,
        loop: true
    });
</script>

</body>
</html>
